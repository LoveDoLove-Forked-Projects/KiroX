<!-- @file 邮箱配置与列表：cloudmail。 -->
<div class="card provider-config-card">
  <div class="settings-group">
    <div class="settings-group-title content-toolbar">
      <div class="content-heading">
        <img class="email-provider-icon" src="assets/cloudmail.svg" alt="" />
        <span data-i18n="accounts.cloudmailTitle">Cloud-Mail 自部署邮箱</span>
      </div>
      <span
        id="settings-cloudmail-summary"
        data-i18n="cloudmail.summaryNone"
        class="provider-summary"
        >未配置</span
      >
    </div>
    <div class="moemail-add-section">
      <div class="moemail-add-header">
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        <span data-i18n="accounts.addConfig">添加新配置</span>
      </div>
      <div class="moemail-add-body">
        <div class="moemail-input-row">
          <div class="moemail-input-group field-grow">
            <label for="cloudmail-inline-name"
              ><span data-i18n="accounts.configName">名称</span>
              <span data-i18n="accounts.optional" class="field-optional">(可选)</span></label
            >
            <input
              type="text"
              id="cloudmail-inline-name"
              placeholder="自动生成"
              data-i18n-placeholder="accounts.configNamePlaceholder"
              class="form-input"
            />
          </div>
          <div class="moemail-input-group field-wide">
            <label data-i18n="accounts.apiUrl" for="cloudmail-inline-url">URL</label>
            <input
              type="text"
              id="cloudmail-inline-url"
              placeholder="https://mail.example.com"
              class="form-input"
            />
          </div>
        </div>
        <div class="moemail-input-row">
          <div class="moemail-input-group field-grow">
            <label data-i18n="cloudmail.adminEmail" for="cloudmail-inline-email">管理员邮箱</label>
            <input
              type="text"
              id="cloudmail-inline-email"
              placeholder="admin@example.com"
              class="form-input"
            />
          </div>
          <div class="moemail-input-group field-grow">
            <label data-i18n="cloudmail.adminPassword" for="cloudmail-inline-password"
              >管理员密码</label
            >
            <input
              type="password"
              id="cloudmail-inline-password"
              placeholder="••••••••"
              class="form-input"
              autocomplete="current-password"
            />
          </div>
        </div>
        <div class="moemail-action-row">
          <button
            data-action="inlineTestCloudMail"
            class="btn btn-secondary btn-sm"
            id="cloudmail-inline-test-btn"
            type="button"
          >
            <svg
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 11.08V12a10 10 0 11-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span data-i18n="accounts.testConnection">测试连接</span>
          </button>
          <button data-action="inlineAddCloudMail" class="btn btn-dark btn-sm" type="button">
            <svg
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span data-i18n="accounts.addConfigBtn">添加配置</span>
          </button>
          <span id="cloudmail-inline-status" class="moemail-status-text"></span>
        </div>
        <div data-i18n="cloudmail.domainHint" class="provider-domain-help">
          域名将在保存或测试连接时自动从服务器拉取，无需手动填写。
        </div>
      </div>
    </div>
    <div id="cloudmail-inline-list" class="moemail-config-list"></div>
  </div>
</div>
