<!-- @file 概览任务操作与状态。 -->
<div class="db-detail-section">
  <div class="db-detail-top">
    <div class="db-detail-title">
      <span class="db-detail-title-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3.34 19a10 10 0 1 1 17.32 0"></path>
          <path d="m12 14 4-4"></path>
        </svg>
      </span>
      <span data-i18n="overview.taskControl">任务控制</span>
    </div>
    <div class="db-detail-actions">
      <span class="status-dot" id="st-dot"></span>
    </div>
  </div>
  <div class="db-detail-body overview-task-body">
    <div class="overview-task-actions">
      <button
        id="btn-start"
        data-action="openNewTaskModal"
        class="btn btn-dark btn-sm button-fill"
        type="button"
      >
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="button-leading-icon"
        >
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span data-i18n="overview.newTask">新建任务</span>
      </button>
      <button
        id="btn-stop"
        data-action="stopTask"
        class="btn btn-secondary btn-sm button-fill"
        disabled
        data-i18n="overview.stop"
        type="button"
      >
        停止
      </button>
    </div>

    <div class="db-sub-card overview-status-card">
      <div class="db-sub-card-head">
        <svg
          viewBox="0 0 24 24"
          width="13"
          height="13"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
        <span data-i18n="overview.liveStatus">实时状态</span>
      </div>
      <div class="db-sub-row">
        <span id="st-progress-label" data-i18n="overview.progress">进度</span
        ><span id="st-progress" class="text-semibold">0/0</span>
      </div>
      <div
        id="progress-track"
        class="db-progress-track"
        role="progressbar"
        aria-labelledby="st-progress-label"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="progress-bar" class="db-progress-fill"></div>
      </div>
      <div class="overview-status-grid">
        <div class="db-sub-row">
          <span data-i18n="overview.success">成功</span
          ><span class="db-num-green" id="st-success">0</span>
        </div>
        <div class="db-sub-row">
          <span data-i18n="overview.failed">失败</span
          ><span class="db-num-red" id="st-failed">0</span>
        </div>
        <div class="db-sub-row">
          <span data-i18n="overview.elapsed">已耗时</span><span id="st-elapsed">0s</span>
        </div>
        <div class="db-sub-row">
          <span data-i18n="overview.avg">平均耗时</span><span id="st-avg">-</span>
        </div>
      </div>
    </div>
  </div>
</div>
