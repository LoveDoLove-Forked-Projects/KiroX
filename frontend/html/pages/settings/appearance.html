<!-- @file 设置分组：appearance。 -->
<div class="card settings-card">
  <div class="settings-group">
    <div class="settings-group-title" data-i18n="settings.appearance">外观与更新</div>
    <div class="settings-grid">
      <div class="settings-field">
        <span data-i18n="settings.theme">主题</span>
        <div id="setting-theme" class="custom-dropdown" data-value="system">
          <div class="dropdown-selected" data-action="toggleDropdown">
            <span class="dropdown-selected-text" data-i18n="settings.themeSystem">跟随系统</span
            ><span class="dropdown-arrow"></span>
          </div>
          <div class="dropdown-options">
            <div class="dropdown-option" data-value="system" data-i18n="settings.themeSystem">
              跟随系统
            </div>
            <div class="dropdown-option" data-value="light" data-i18n="settings.themeLight">
              浅色
            </div>
            <div class="dropdown-option" data-value="dark" data-i18n="settings.themeDark">深色</div>
          </div>
        </div>
      </div>
      <div class="settings-field">
        <span data-i18n="settings.language">界面语言</span>
        <div id="setting-language" class="custom-dropdown" data-value="zh">
          <div class="dropdown-selected" data-action="toggleDropdown">
            <span class="dropdown-selected-text">简体中文</span><span class="dropdown-arrow"></span>
          </div>
          <div class="dropdown-options">
            <div class="dropdown-option" data-value="zh">简体中文</div>
            <div class="dropdown-option" data-value="en">English</div>
            <div class="dropdown-option" data-value="ja">日本語</div>
          </div>
        </div>
      </div>
    </div>
    <div class="settings-item settings-inline-item">
      <div>
        <div class="settings-item-title" data-i18n="settings.autoUpdate">启动时自动检查更新</div>
      </div>
      <label class="toggle-switch"
        ><input type="checkbox" id="setting-auto-update" /><span class="toggle-slider"></span
      ></label>
    </div>
  </div>
</div>
