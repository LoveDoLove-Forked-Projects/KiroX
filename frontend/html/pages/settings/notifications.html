<!-- @file 设置分组：notifications。 -->
<div class="card settings-card">
  <div class="settings-group">
    <div class="settings-group-title" data-i18n="settings.notification">通知</div>

    <div class="settings-item settings-inline-item">
      <div>
        <div class="settings-item-title" data-i18n="settings.sound">提示音</div>
        <div class="settings-item-desc" data-i18n="settings.soundDesc">任务结束时播放提示音</div>
      </div>
      <label class="toggle-switch"
        ><input type="checkbox" id="cfg-sound" /><span class="toggle-slider"></span
      ></label>
    </div>
    <div class="settings-item settings-inline-item">
      <div>
        <div class="settings-item-title" data-i18n="settings.desktopNotification">桌面通知</div>
        <div class="settings-item-desc" data-i18n="settings.desktopNotificationDesc">
          任务完成时发送 Windows 桌面通知
        </div>
      </div>
      <label class="toggle-switch"
        ><input type="checkbox" id="setting-desktop-notification" /><span
          class="toggle-slider"
        ></span
      ></label>
    </div>
    <div class="settings-item">
      <div class="settings-item-title" data-i18n="settings.soundVolume">提示音音量</div>
      <div class="settings-range-row">
        <input
          type="range"
          class="settings-volume-range"
          id="setting-sound-volume"
          min="0"
          max="100"
          step="5"
          value="70"
          data-input-action="syncVolumeLabel"
        /><output id="setting-sound-volume-label">70%</output>
      </div>
    </div>
  </div>
</div>
