  <div class="page-scroll settings-content">
    <div class="settings-page-header">
      <div>
        <div class="settings-page-title" data-i18n="settings.title">设置</div>
        <div class="settings-page-subtitle" data-i18n="settings.subtitle">配置通知与运行策略</div>
      </div>
      <button
        type="button"
        id="settings-save-button"
        class="btn btn-dark"
        data-action="saveAppSettings"

        disabled

      id="settings-floating-save"
