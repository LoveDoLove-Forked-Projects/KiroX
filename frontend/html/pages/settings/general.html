<!-- @file 设置分组：general。 -->
<div class="card settings-card">
  <div class="settings-group">
    <div class="settings-group-title" data-i18n="settings.general">常规</div>

    <div class="settings-item">
      <div class="settings-item-main">
        <div class="settings-item-title" data-i18n="settings.dataDir">存储目录</div>
        <div class="settings-item-desc" data-i18n="settings.dataDirDesc">
          邮箱池、邮箱服务配置和代理池的存储位置；默认位于本机应用数据目录
        </div>
      </div>
      <div class="settings-item-action">
        <div class="directory-controls">
          <input
            type="text"
            id="cfg-data-dir"
            placeholder="默认存储路径"
            data-i18n-placeholder="settings.dataDirPlaceholder"
            class="form-input field-grow"
            readonly
          />
          <button
            data-action="selectDataDir"
            class="btn btn-secondary btn-sm"
            data-i18n="common.select"
            type="button"
          >
            选择
          </button>
          <button
            data-action="resetDataDir"
            class="btn btn-secondary btn-sm"
            data-i18n="common.reset"
            type="button"
          >
            重置
          </button>
        </div>
      </div>
    </div>

    <div class="settings-item">
      <div class="settings-item-main">
        <div class="settings-item-title" data-i18n="settings.outputDir">注册结果输出目录</div>
        <div class="settings-item-desc" data-i18n="settings.outputDirDesc">
          成功账号以明文 JSON 数组写入该目录下的 accounts.json
        </div>
      </div>
      <div class="settings-item-action">
        <div class="directory-controls">
          <input
            type="text"
            id="cfg-result-output-dir"
            placeholder="默认：文档/KiroX"
            data-i18n-placeholder="settings.outputDirPlaceholder"
            class="form-input field-grow"
            readonly
          />
          <button
            data-action="selectResultOutputDir"
            class="btn btn-secondary btn-sm"
            data-i18n="common.select"
            type="button"
          >
            选择
          </button>
          <button
            data-action="resetResultOutputDir"
            class="btn btn-secondary btn-sm"
            data-i18n="common.reset"
            type="button"
          >
            重置
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
