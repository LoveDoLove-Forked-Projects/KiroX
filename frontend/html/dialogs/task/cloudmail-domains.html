<!-- @file 任务中的 Cloud-Mail 域名选项。 -->
<div id="cloudmail-config-select" class="initially-hidden">
  <div class="form-group field-last">
    <div class="domain-field-label">
      <div class="domain-heading">
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="cloudmail-domain-icon"
        >
          <path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"></path>
        </svg>
        <span data-i18n="register.selectDomain">选择域名</span>
      </div>
      <button
        type="button"
        data-action="selectAllCloudMailDomains"
        class="moemail-select-all-btn"
        data-i18n="register.selectAllDomain"
      >
        全选域名
      </button>
    </div>
    <div id="cfg-cloudmail-domains-list" class="moemail-domains-container">
      <div data-i18n="common.loading" class="domain-feedback">加载中...</div>
    </div>
  </div>
</div>
