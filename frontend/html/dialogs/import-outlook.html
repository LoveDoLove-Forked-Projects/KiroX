<!-- @file Outlook 邮箱导入弹窗。 -->
<div id="add-outlook-modal" class="modal-overlay">
  <div class="modal-content import-dialog">
    <div class="import-dialog-heading">
      <div class="content-heading">
        <img src="assets/outlook.svg" alt="" class="import-provider-icon" />
        <h3 data-i18n="accounts.addModalTitle" class="dialog-title">添加微软邮箱账号</h3>
      </div>
      <button
        type="button"
        class="modal-close-btn"
        data-action="closeAddOutlookModal"
        aria-label="关闭"
        title="关闭"
        data-i18n-title="common.close"
        data-i18n-aria-label="common.close"
      >
        ×
      </button>
    </div>

    <div class="import-file-section">
      <div data-i18n="accounts.importFile" class="import-section-label">导入文件</div>
      <div class="content-heading">
        <button data-action="importOutlookFile" class="btn btn-secondary field-grow" type="button">
          <svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span data-i18n="accounts.selectTxt">选择 TXT 文件</span>
        </button>
        <span data-i18n="accounts.perLine" class="text-caption">每行一个账号</span>
      </div>
    </div>

    <div class="import-divider">
      <div class="import-divider-line"></div>
      <span data-i18n="accounts.orManual" class="import-divider-label">或手动输入</span>
      <div class="import-divider-line"></div>
    </div>

    <div class="section-spacing">
      <div data-i18n="accounts.manualInput" class="import-input-label">手动输入</div>
      <div data-i18n="accounts.manualFormat" class="import-format-help">
        格式：邮箱----密码----ClientID----RefreshToken----imap/graph，每行一个（不填最后一段默认
        imap）
      </div>
      <textarea
        id="cfg-outlook-data"
        class="form-input import-input"
        rows="6"
        placeholder="user@outlook.com----password----clientid----refreshtoken"
        data-i18n-placeholder="accounts.manualPlaceholder"
      ></textarea>
    </div>
    <div class="import-dialog-actions">
      <button
        data-action="closeAddOutlookModal"
        class="btn btn-secondary"
        data-i18n="common.cancel"
        type="button"
      >
        取消
      </button>
      <button
        data-action="addOutlookAccounts"
        class="btn btn-dark"
        data-i18n="accounts.addToList"
        type="button"
      >
        添加到列表
      </button>
    </div>
  </div>
</div>
