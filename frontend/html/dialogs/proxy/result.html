<!-- @file 代理检测结果弹窗。 -->
<div id="ip-result-modal" class="modal-overlay foreground-overlay">
  <div class="modal-content dialog-compact">
    <div class="dialog-heading">
      <h3 data-i18n="ip.resultTitle" class="dialog-title">测试结果</h3>
      <button
        type="button"
        class="modal-close-btn"
        data-action="closeIpResultModal"
        aria-label="关闭"
        title="关闭"
        data-i18n-title="common.close"
        data-i18n-aria-label="common.close"
      >
        ×
      </button>
    </div>
    <div id="ip-result-body"></div>
  </div>
</div>
